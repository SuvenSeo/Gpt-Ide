name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --silent
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck > typecheck.log 2>&1
      - name: Upload typecheck diagnostics
        if: steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: typecheck.log
          retention-days: 3
      - name: Fail on typecheck errors
        if: steps.typecheck.outcome == 'failure'
        run: cat typecheck.log && exit 1
      - run: npm test
      - run: npm run build
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint > lint.log 2>&1
      - name: Upload lint diagnostics
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lint-log
          path: lint.log
          retention-days: 3
      - name: Fail on lint errors
        if: steps.lint.outcome == 'failure'
        run: cat lint.log && exit 1
