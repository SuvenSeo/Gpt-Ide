name: Bootstrap GPT IDE feature branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-gpt-ide
          fetch-depth: 0

      - name: Reconstruct and verify repository archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/gpt-ide.tar.gz.b64
          base64 --decode /tmp/gpt-ide.tar.gz.b64 > /tmp/gpt-ide.tar.gz
          echo "5b9e48fe49a618bd2d0d93907bad9d52ec793cc59527e7cde7a30825c6cdaffd  /tmp/gpt-ide.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/gpt-ide.tar.gz -C .
          rm -rf .bootstrap .github/workflows/bootstrap.yml

      - name: Commit verified project tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: complete ChatGPT-powered GPT IDE"
          git push origin HEAD:agent/full-gpt-ide
